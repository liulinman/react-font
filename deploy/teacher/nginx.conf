server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /teacher/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /teacher/ {
        try_files $uri $uri/ /teacher/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
