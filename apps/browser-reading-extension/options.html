<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接 English World</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <h1>连接 English World</h1>
    <p>选词查找时，扩展会把所选单词、原句及网页来源发送给你的 English World 服务。点击保存后，原句和链接才会加入个人词库。</p>
    <form>
      <label for="origin">English World 网站地址</label>
      <input id="origin" type="url" placeholder="https://example.com" required>
      <div class="actions">
        <button type="submit">连接账号</button>
        <button id="disconnect" type="button" hidden>断开连接</button>
      </div>
    </form>
    <p id="status" role="status"></p>
  </main>
</body>
</html>
