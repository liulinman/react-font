name: Deploy Docker to Server

on:
  push:
    branches:
      - yifeng/docker-compose

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # 构建两个应用的 Docker 镜像
      - name: Build Docker Images
        run: |
          docker-compose -f docker-compose.yml build

      # 将两个镜像保存为一个 tar 文件
      - name: Save Docker Images
        run: |
          docker save -o frontend.tar frontend-english-world:latest frontend-web-utils:latest

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER }}

      # 传输镜像和配置到服务器
      - name: Transfer to Server
        run: |
          scp -o StrictHostKeyChecking=no frontend.tar root@47.108.140.63:/root
          scp -o StrictHostKeyChecking=no docker-compose.yml root@47.108.140.63:/root
          scp -o StrictHostKeyChecking=no nginx.conf root@47.108.140.63:/root/nginx.conf

      # 在服务器上加载镜像并启动两个容器
      - name: Deploy on Server
        run: |
          ssh -T -o StrictHostKeyChecking=no root@47.108.140.63 << 'EOF'
            docker stop frontend-english-world frontend-web-utils || true
            docker rm frontend-english-world frontend-web-utils || true

            docker load -i /root/frontend.tar

            docker-compose -f docker-compose.yml up -d
          EOF
