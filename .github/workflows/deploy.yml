name: Verify and deploy frontend

on:
  push:
    branches:
      - yifeng/docker-compose
  workflow_dispatch:

concurrency:
  group: english-world-frontend-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPLOY_HOST: 124.223.157.129
  DEPLOY_USER: ubuntu
  DEPLOY_TARGET: /opt/english-world/react-font
  DEPLOY_COMPOSE_DIR: /opt/english-world/deploy
  DEPLOY_SERVICE: frontend
  DEPLOY_CONTAINER: english-world-frontend
  SSH_CONTROL_PATH: /tmp/english-world-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.3.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run English World tests
        run: pnpm --filter @font/english-world exec vitest run --no-file-parallelism --testTimeout=60000

      - name: Run Admin tests
        run: pnpm --filter @font/admin test --run

      - name: Build English World
        run: pnpm --filter @font/english-world build

      - name: Build Admin
        run: pnpm --filter @font/admin build

      - name: Preserve verified production assets
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: |
            apps/english-world/dist/
            apps/admin/dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download verified production assets
        uses: actions/download-artifact@v4
        with:
          name: production-assets
          path: apps

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Package and upload source
        run: |
          archive="$RUNNER_TEMP/react-font-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude=coverage \
            --exclude='**/coverage' \
            --exclude='.env*' \
            -czf "$archive" .
          scp -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=5 \
            -o ControlMaster=auto \
            -o ControlPath="$SSH_CONTROL_PATH" \
            -o ControlPersist=300 \
            "$archive" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/react-font-${GITHUB_SHA}.tar.gz"

      - name: Deploy frontend without restarting dependencies
        run: |
          ssh -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=5 \
            -o ControlMaster=auto \
            -o ControlPath="$SSH_CONTROL_PATH" \
            -o ControlPersist=300 \
            -o ServerAliveInterval=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "ARCHIVE=/tmp/react-font-${GITHUB_SHA}.tar.gz \
            TARGET=${DEPLOY_TARGET} \
            COMPOSE_DIR=${DEPLOY_COMPOSE_DIR} \
            SERVICE=${DEPLOY_SERVICE} \
            CONTAINER=${DEPLOY_CONTAINER} bash -s" <<'REMOTE'
          set -euo pipefail

          temp_dir="$(mktemp -d /tmp/english-world-frontend.XXXXXX)"
          cleanup() {
            rm -rf "$temp_dir" "$ARCHIVE"
          }
          trap cleanup EXIT

          tar -xzf "$ARCHIVE" -C "$temp_dir"
          sudo mkdir -p "$TARGET"
          sudo rsync -a --delete --exclude='.env*' "$temp_dir/" "$TARGET/"
          sudo install -m 0644 "$TARGET/nginx.conf" "$COMPOSE_DIR/nginx.conf"

          cd "$COMPOSE_DIR"
          test -s "$TARGET/apps/english-world/dist/index.html"
          test -s "$TARGET/apps/admin/dist/index.html"
          service_image_name="$(sudo docker inspect --format '{{.Config.Image}}' "$CONTAINER")"
          sudo docker build -f "$TARGET/Dockerfile.production" -t "$service_image_name" "$TARGET"
          sudo docker compose up -d --no-deps --no-build "$SERVICE"
          for app in english-world admin; do
            container_index=/usr/share/nginx/html/index.html
            if [ "$app" = admin ]; then container_index=/usr/share/nginx/html/admin/index.html; fi
            expected="$(sha256sum "$TARGET/apps/$app/dist/index.html" | cut -d ' ' -f 1)"
            actual="$(sudo docker exec "$CONTAINER" sha256sum "$container_index" | cut -d ' ' -f 1)"
            test "$expected" = "$actual"
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1/ >/dev/null; then
              echo "Frontend is ready."
              sudo docker image prune -f
              exit 0
            fi
            sleep 2
          done

          sudo docker logs --tail 120 "$CONTAINER"
          exit 1
          REMOTE
